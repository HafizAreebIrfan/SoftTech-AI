name: Backend CI

on:
  push:
    branches: [backend-branch]
  pull_request:
    branches: [backend-branch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Notify Render deploy (backend)
        if: github.ref == 'refs/heads/backend-branch'
        run: |
          curl -s "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" \
            -X POST
