name: Backend CI

on:
  push:
    branches: [backend-branch]
  pull_request:
    branches: [backend-branch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build TypeScript
        run: npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Notify Render deploy (backend)
        if: github.ref == 'refs/heads/backend-branch'
        run: |
          curl -s "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" \
            -X POST

      - name: Collect failure details
        if: failure()
        run: |
          echo "RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "ACTOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "COMMIT=${{ github.sha }}" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_ENV
          npm audit --json 2>/dev/null | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    vulns = data.get('vulnerabilities', {})
    high = [(k, v['severity'], v.get('fixAvailable', False)) for k, v in vulns.items() if v['severity'] in ['high', 'critical']]
    if high:
        print('AUDIT_ISSUES=' + '; '.join([f'{name} ({sev}) - fix available: {fix}' for name, sev, fix in high[:5]]))
    else:
        print('AUDIT_ISSUES=none')
except:
    print('AUDIT_ISSUES=could not parse')
" >> $GITHUB_ENV || echo "AUDIT_ISSUES=audit not run" >> $GITHUB_ENV

      - name: Send failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: SoftTech AI CI <${{ secrets.EMAIL_USERNAME }}>
          subject: "Backend CI Failed - ${{ env.BRANCH }} - ${{ env.ACTOR }}"
          body: |
            Backend CI pipeline failed.

            Branch:     ${{ env.BRANCH }}
            Pushed by:  ${{ env.ACTOR }}
            Commit:     ${{ env.COMMIT }}
            Message:    ${{ env.COMMIT_MSG }}

            Dependency vulnerabilities found:
            ${{ env.AUDIT_ISSUES }}

            Common fixes:
            - Run: npm audit fix
            - For breaking changes: npm audit fix --force (review changes first)
            - If a specific package has no fix yet, check https://github.com/advisories

            Full logs: ${{ env.RUN_UR }}
