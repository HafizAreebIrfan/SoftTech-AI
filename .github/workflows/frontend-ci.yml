name: Frontend CI

on:
  push:
    branches: [frontend-branch]
  pull_request:
    branches: [frontend-branch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build (Vite)
        run: npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Notify Render deploy (frontend)
        if: github.ref == 'refs/heads/frontend-branch'
        run: curl -s -X POST \"${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}\"

      - name: Collect failure details
        if: failure()
        run: |
          echo \"RUN_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\" >> $GITHUBE_ENV
          echo \"BRANCH=${{ github.ref_name }}\" >> $GITHUB_ENV
          echo \"ACTOR=${{ github.actor }}\" >> $GITHUB_ENV
          echo \"COMMIT=${{ github.sha }}\" >> $GITHUB_ENV
          git log -1 --pretty=%B | head -1 | xargs -I{} echo \"COMMIT_MSG={}\" >> $GITHUB_ENV
          npm audit --json 2>/dev/null > /tmp/audit.json || true
          python3 /tmp/parse_audit.py >> $GITHUBE_ENV || echo \"AUDIT_ISSUES=could not parse\" >> $GITHUBE_ENV

      - name: Write audit parser
        if: failure()
        run: |
          cat > /tmp/parse_audit.py << 'EOF'
          import json, sys
          try:
              with open('/tmp/audit.json') as f:
                  data = json.load(f)
              vulns = data.get('vulnerabilities', {})
              high = [(k, v['severity'], v.get('fixAvailable', False)) for k, v in vulns.items() if v['severity'] in ['high', 'critical']]
              if high:
                  issues = '; '.join([f'{n} ({s}) - fix available: {fx}' for n, s, fx in high[:5]])
                  print(f'AUDIT_ISSUES={issues}')
              else:
                  print('AUDIT_ISSUES=none')
          except Exception as e:
              print(f'AUDIT_ISSUES=parse error: {e}')
          EOF

      - name: Send failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: SoftTech AI CI <${{ secrets.EMAIL_USERNAME }}>
          subject: \"Frontend CI Failed - ${{ env.BRANCH }} - ${{ env.ACTOR }}\"
          body: |
            Frontend CI pipeline failed.

            Branch:     ${{ env.BRANCH }}
            Pushed by:  ${{ env.ACTOR }}
            Commit:     ${{ env.COMMIT }}
            Message:    ${{ env.COMMIT_MSG }}

            Dependency vulnerabilities found:
            ${{ env.AUDIT_ISSUES }}

            Common fixes:
            - Run: npm audit fix
            - For breaking changes: npm audit fix --force (review changes first)
            - Check https://github.com/advisories for packages with no fix yet
            - For Vite build failures: check for missing env variables or broken imports

            Full logs: ${{ env.RUN_URL }}
