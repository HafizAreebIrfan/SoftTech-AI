name: Frontend CI

on:
  push:
    branches: [frontend-branch]
  pull_request:
    branches: [frontend-branch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build (Vite)
        run: npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Notify Render deploy (frontend)
        if: github.ref == 'refs/heads/frontend-branch'
        run: |
          curl -s "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -X POST

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            --data '{"text":"Frontend pipeline failed on ${{ github.ref }} by ${{ github.actor }}"}'
