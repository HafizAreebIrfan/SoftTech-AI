name: Frontend CI

on:
  push:
    branches: [frontend-branch]
  pull_request:
    branches: [frontend-branch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build (Vite)
        run: npm run build

      - name: Notify Render deploy (frontend)
        if: github.ref == 'refs/heads/frontend-branch'
        run: |
          curl -s "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -X POST
